<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oliver Alvarenga</title>
<meta name="description" content="Mateo 19:26">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111'/%3E%3Ctext x='50' y='60' font-family='Helvetica, Arial, sans-serif' font-size='28' font-weight='300' fill='%23f2f2f2' text-anchor='middle' letter-spacing='2'%3EOA%3C/text%3E%3C/svg%3E">
<link rel="preload" as="image" href="assets/oliver.jpg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1>Oliver Alvarenga</h1>
<canvas id="fx" role="img" aria-label="Retrato de Oliver Alvarenga en arte ASCII animado"></canvas>

<script>
/*
 * "All about the Benjamins" — dither render of a photo with tint, post-effects and flicker.
 * Pipeline: background → per-cell dither → colour adjust + tint → post-effects (lights and mask are off).
 */
(function () {
  var P = {
    renderMode: 'dither',
    bgMode: 'solid', bgColor: '#000000', bgBlur: 12, bgOpacity: 90,
    cellSize: 14, coverage: 96, invert: false,
    brightness: 0, contrast: 115, edgeEmphasis: 40, density: 0,
    tint: '#00ff66', tintOpacity: 45, overlayBlend: 'overlay',
    saturation: 100, grayscale: 0,
    blurType: 'off', blurAmount: 35,
    pfx: {
      vignette:  { enabled: true,  intensity: 38 },
      scanLines: { enabled: true,  intensity: 28 },
      chromatic: { enabled: true,  intensity: 40 },
      bloom:     { enabled: true,  intensity: 60 },
      filmGrain: { enabled: true,  intensity: 40 },
      glitch:    { enabled: true,  intensity: 20 },
      pixelate:  { enabled: false, intensity: 15 },
      halftone:  { enabled: false, intensity: 20 },
      filmDust:  { enabled: false, intensity: 20 }
    },
    animated: true, animStyle: 'flicker',
    animSpeed: { enabled: true, intensity: 100 },
    animIntensity: { enabled: true, intensity: 60 },
    lights: { enabled: false, points: [] },
    mask: { enabled: false }
  };

  var FOCUS_X = 0.58;
  var SUB = 4; // dither sub-pixels per cell edge (Bayer 4×4)
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var img = new Image();

  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function hash(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // Colour adjustments in order: brightness → contrast → saturation → grayscale
  function adjust(r, g, b) {
    var br = P.brightness * 2.55, k = P.contrast / 100, s = P.saturation / 100, gs = P.grayscale / 100;
    r = (r + br - 128) * k + 128; g = (g + br - 128) * k + 128; b = (b + br - 128) * k + 128;
    var l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    r = l + (r - l) * s; g = l + (g - l) * s; b = l + (b - l) * s;
    r += (l - r) * gs; g += (l - g) * gs; b += (l - b) * gs;
    return [Math.max(0, Math.min(255, r)), Math.max(0, Math.min(255, g)), Math.max(0, Math.min(255, b))];
  }

  var W, H, dpr, cols, rows, subW, subH;
  var cellCol, fineLum, cover, dith, dithCtx, dithData, frame, fctx, tmp, tctx, small, sctx, scan, vign, grain = [];

  // Draw the photo into a w×h grid (height-fitted, centred) and read it back; the browser averages each cell.
  function sample(w, h) {
    var c = mk(w, h), x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    var scale = h / img.height, dw = img.width * scale;
    // on narrow screens keep the face (≈58% across the photo) centred instead of the photo's middle
    var dx = dw > w ? Math.max(w - dw, Math.min(0, w / 2 - FOCUS_X * dw)) : (w - dw) / 2;
    x.drawImage(img, dx, 0, dw, h);
    return x.getImageData(0, 0, w, h).data;
  }

  function setup() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
    canvas.width = W; canvas.height = H;
    var cs = P.cellSize * dpr;
    cols = Math.ceil(W / cs); rows = Math.ceil(H / cs);
    subW = cols * SUB; subH = rows * SUB;

    // 2. per-cell average colour
    var cd = sample(cols, rows);
    cellCol = new Float32Array(cols * rows * 3);
    for (var i = 0; i < cols * rows; i++) {
      var a = adjust(cd[i * 4], cd[i * 4 + 1], cd[i * 4 + 2]);
      cellCol[i * 3] = a[0]; cellCol[i * 3 + 1] = a[1]; cellCol[i * 3 + 2] = a[2];
    }

    // fine luminance for the dither pattern, with Sobel edges mixed in (edgeEmphasis)
    var fd = sample(subW, subH), n = subW * subH, lum = new Float32Array(n);
    for (var j = 0; j < n; j++) {
      var c = adjust(fd[j * 4], fd[j * 4 + 1], fd[j * 4 + 2]);
      lum[j] = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
    }
    fineLum = new Float32Array(n);
    var ee = P.edgeEmphasis / 100;
    for (var y = 0; y < subH; y++) for (var x = 0; x < subW; x++) {
      var idx = y * subW + x, e = 0;
      if (x > 0 && y > 0 && x < subW - 1 && y < subH - 1) {
        var gx = lum[idx - subW + 1] + 2 * lum[idx + 1] + lum[idx + subW + 1] - lum[idx - subW - 1] - 2 * lum[idx - 1] - lum[idx + subW - 1];
        var gy = lum[idx + subW - 1] + 2 * lum[idx + subW] + lum[idx + subW + 1] - lum[idx - subW - 1] - 2 * lum[idx - subW] - lum[idx - subW + 1];
        e = Math.min(1, Math.sqrt(gx * gx + gy * gy));
      }
      var v = lum[idx] + e * ee - P.density / 100 * 0.5;
      fineLum[idx] = P.invert ? 1 - v : v;
    }

    cover = new Uint8Array(cols * rows);
    for (var k = 0; k < cols * rows; k++) cover[k] = hash(k, 7) * 100 < P.coverage ? 1 : 0;

    dith = mk(subW, subH); dithCtx = dith.getContext('2d');
    dithData = dithCtx.createImageData(subW, subH);
    frame = mk(W, H); fctx = frame.getContext('2d');
    tmp = mk(W, H); tctx = tmp.getContext('2d');
    small = mk(Math.max(1, W >> 3), Math.max(1, H >> 3)); sctx = small.getContext('2d');

    // scan-line pattern
    scan = mk(1, Math.max(2, Math.round(3 * dpr)));
    var sc = scan.getContext('2d'); sc.fillStyle = '#000'; sc.fillRect(0, 0, 1, Math.max(1, Math.round(dpr)));
    // vignette
    vign = mk(W, H);
    var vc = vign.getContext('2d'), g = vc.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.hypot(W, H) / 2);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,' + Math.min(1, P.pfx.vignette.intensity / 100 * 1.6) + ')');
    vc.fillStyle = g; vc.fillRect(0, 0, W, H);
    // film-grain tiles, cycled per frame
    grain = [];
    for (var t = 0; t < 4; t++) {
      var gc = mk(192, 192), gx2 = gc.getContext('2d'), gd = gx2.createImageData(192, 192);
      for (var p = 0; p < gd.data.length; p += 4) { var r = Math.random() * 255; gd.data[p] = gd.data[p + 1] = gd.data[p + 2] = r; gd.data[p + 3] = 255; }
      gx2.putImageData(gd, 0, 0); grain.push(gc);
    }
  }

  // 3. dither every cell into a low-res buffer (one pixel per sub-cell), with the flicker animation
  function renderCells(t) {
    var d = dithData.data, ai = P.animIntensity.enabled ? P.animIntensity.intensity / 100 : 0;
    var rate = 4 + 16 * (P.animSpeed.enabled ? P.animSpeed.intensity / 100 : 0);
    var tick = reduceMotion || !P.animated ? 0 : Math.floor(t / 1000 * rate);
    var global = tick ? 1 - ai * 0.12 * hash(tick, 3) : 1;
    for (var cy = 0; cy < rows; cy++) for (var cx = 0; cx < cols; cx++) {
      var ci = cy * cols + cx, on = cover[ci], f = global;
      if (tick) {
        var r = hash(ci, tick);
        if (r < 0.08 * ai) f *= 0.45; else if (r > 1 - 0.04 * ai) f *= 1.5;
      }
      var m = 0.55 + 0.45 * Math.min(f, 1.2);
      var cr = Math.min(255, (cellCol[ci * 3] * 0.7 + 70) * m);
      var cg = Math.min(255, (cellCol[ci * 3 + 1] * 0.7 + 70) * m);
      var cb = Math.min(255, (cellCol[ci * 3 + 2] * 0.7 + 70) * m);
      for (var sy = 0; sy < SUB; sy++) for (var sx = 0; sx < SUB; sx++) {
        var i = (cy * SUB + sy) * subW + cx * SUB + sx, o = i * 4;
        if (on && fineLum[i] * f > (BAYER[sy * 4 + sx] + 0.5) / 16) {
          d[o] = cr; d[o + 1] = cg; d[o + 2] = cb; d[o + 3] = 255;
        } else d[o + 3] = 0;
      }
    }
    dithCtx.putImageData(dithData, 0, 0);
  }

  function draw(t) {
    var pfx = P.pfx, still = reduceMotion || !P.animated;

    // 1. background
    fctx.globalCompositeOperation = 'source-over';
    fctx.globalAlpha = 1; fctx.fillStyle = '#000'; fctx.fillRect(0, 0, W, H);
    fctx.globalAlpha = P.bgOpacity / 100; fctx.fillStyle = P.bgColor; fctx.fillRect(0, 0, W, H);
    fctx.globalAlpha = 1;

    // 3. cells
    renderCells(t);
    fctx.imageSmoothingEnabled = false;
    fctx.drawImage(dith, 0, 0, subW, subH, 0, 0, cols * P.cellSize * dpr, rows * P.cellSize * dpr);
    fctx.imageSmoothingEnabled = true;

    // 4. tint
    fctx.globalCompositeOperation = P.overlayBlend; fctx.globalAlpha = P.tintOpacity / 100;
    fctx.fillStyle = P.tint; fctx.fillRect(0, 0, W, H);
    // overlay alone barely tints the near-white dots; a multiply pass at the same opacity carries the green into the highlights
    fctx.globalCompositeOperation = 'multiply'; fctx.fillRect(0, 0, W, H);
    fctx.globalCompositeOperation = 'source-over'; fctx.globalAlpha = 1;

    // 5. post effects
    if (pfx.chromatic.enabled) {
      // split off the red channel and shift it sideways
      var off = Math.max(1, Math.round(pfx.chromatic.intensity / 100 * 5 * dpr));
      tctx.globalCompositeOperation = 'copy'; tctx.drawImage(frame, 0, 0);
      tctx.globalCompositeOperation = 'multiply'; tctx.fillStyle = '#ff0000'; tctx.fillRect(0, 0, W, H);
      fctx.globalCompositeOperation = 'multiply'; fctx.fillStyle = '#00ffff'; fctx.fillRect(0, 0, W, H);
      fctx.globalCompositeOperation = 'lighter'; fctx.drawImage(tmp, -off, 0);
      fctx.globalCompositeOperation = 'source-over';
    }

    if (pfx.bloom.enabled) {
      // cheap blur: downscale ×8 and add it back on top
      sctx.globalCompositeOperation = 'copy'; sctx.drawImage(frame, 0, 0, small.width, small.height);
      fctx.globalCompositeOperation = 'lighter'; fctx.globalAlpha = pfx.bloom.intensity / 100 * 0.55;
      fctx.drawImage(small, 0, 0, W, H);
      fctx.globalAlpha = 1; fctx.globalCompositeOperation = 'source-over';
    }

    if (pfx.glitch.enabled && !still && Math.random() < pfx.glitch.intensity / 100 * 0.35) {
      tctx.globalCompositeOperation = 'copy'; tctx.drawImage(frame, 0, 0);
      for (var b = 0, bands = 1 + Math.floor(Math.random() * 3); b < bands; b++) {
        var bh = Math.round((4 + Math.random() * 40) * dpr), by = Math.floor(Math.random() * (H - bh));
        var shift = Math.round((Math.random() - 0.5) * pfx.glitch.intensity * 3 * dpr);
        fctx.drawImage(tmp, 0, by, W, bh, shift, by, W, bh);
      }
    }

    if (pfx.scanLines.enabled) {
      fctx.save();
      fctx.globalAlpha = pfx.scanLines.intensity / 100 * 0.9;
      fctx.fillStyle = fctx.createPattern(scan, 'repeat');
      if (!still) fctx.translate(0, (t / 60) % scan.height);
      fctx.fillRect(0, -scan.height, W, H + scan.height * 2);
      fctx.restore();
    }

    if (pfx.filmGrain.enabled) {
      fctx.globalCompositeOperation = 'overlay'; fctx.globalAlpha = pfx.filmGrain.intensity / 100 * 0.35;
      fctx.fillStyle = fctx.createPattern(grain[still ? 0 : Math.floor(t / 50) % grain.length], 'repeat');
      fctx.fillRect(0, 0, W, H);
      fctx.globalAlpha = 1; fctx.globalCompositeOperation = 'source-over';
    }

    if (pfx.vignette.enabled) fctx.drawImage(vign, 0, 0);

    ctx.drawImage(frame, 0, 0);
  }

  var last = 0, ready = false;
  function loop(t) {
    if (t - last >= 33) { last = t; draw(t); } // ~30fps
    requestAnimationFrame(loop);
  }

  var rz;
  addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { if (ready) { setup(); draw(performance.now()); } }, 150);
  });

  img.onload = function () {
    ready = true; setup(); draw(0);
    if (!reduceMotion && P.animated) requestAnimationFrame(loop);
  };
  img.src = 'assets/oliver.jpg';
})();
</script>
</body>
</html>
