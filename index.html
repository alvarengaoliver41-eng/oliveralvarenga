<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oliver Alvarenga</title>
<meta name="description" content="Inspired by the fear of being average.">
<meta name="theme-color" content="#0f1011">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111'/%3E%3Ctext x='50' y='60' font-family='Helvetica, Arial, sans-serif' font-size='28' font-weight='300' fill='%23f2f2f2' text-anchor='middle' letter-spacing='2'%3EOA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.13 0.002 260);
    --fg: oklch(0.95 0.002 260);
    --muted: oklch(0.55 0.004 260);
    --label: oklch(0.5 0.004 260);
    --kicker: oklch(0.6 0.004 260);
    --rule: oklch(1 0 0 / 0.08);
    --card: oklch(0.97 0.002 260);
    --sans: 'Inter', Helvetica, Arial, sans-serif;
    --serif: 'Newsreader', serif;
  }

  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  ::selection { background: oklch(0.94 0.002 260); color: var(--bg); }
  img { display: block; }

  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* Hero */
  .hero {
    position: relative; width: 100%; box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 3vh 6vw 4vh; gap: 8vh;
  }
  .toprow {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    letter-spacing: 0.16em; font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--muted);
  }
  .stack {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    max-width: 1000px; padding: 0 4px; gap: 20px;
  }
  .headline {
    margin: 0; font-weight: 300; line-height: 1; letter-spacing: -0.03em; text-wrap: pretty;
    font-size: clamp(38px, 7.2vw, 104px);
  }
  .headline em { font-style: italic; font-family: var(--serif); font-weight: 400; }
  .kicker { font-family: var(--serif); font-style: italic; letter-spacing: 0.08em; color: var(--kicker); font-size: 14px; }

  /* Portfolio */
  .portfolio {
    width: 100%; box-sizing: border-box; padding: 4vh 6vw 6vh;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .section-label {
    width: 100%; max-width: 1300px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--label);
    border-bottom: 1px solid var(--rule); padding-bottom: 14px;
  }
  .section-label.spaced { margin-top: 6vh; }

  .marquee-viewport {
    width: 100%; max-width: 1300px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 8%, black 92%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, black 8%, black 92%, transparent 100%);
  }
  .marquee { display: flex; width: max-content; animation: marquee 32s linear infinite; }
  /* margin instead of gap so -50% lands exactly on the start of the duplicate set */
  .shot-card {
    flex: 0 0 auto; width: 300px; margin-right: 20px; padding: 16px;
    border-radius: 8px; overflow: hidden; background: var(--card);
    display: flex; align-items: center;
    filter: grayscale(0.6); transition: filter 0.3s;
  }
  .shot-card:hover { filter: grayscale(0); }
  .shot-card img { width: 100%; height: auto; object-fit: contain; }

  .cta-wrap { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; margin-top: 8px; }
  .cta {
    text-decoration: none; background: var(--fg); color: var(--bg); border-radius: 2px;
    padding: 18px 44px; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    white-space: nowrap; transition: transform 0.25s, box-shadow 0.25s;
  }
  .cta:hover, .cta:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 30px oklch(1 0 0 / 0.15); }

  .omnia { width: 100%; max-width: 1300px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; padding: 2vh 0; }
  .omnia img { width: clamp(64px, 8vw, 96px); height: auto; }
  .omnia a {
    text-decoration: none; color: var(--fg); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    border-bottom: 1px solid oklch(1 0 0 / 0.3); padding-bottom: 4px; transition: border-color 0.2s;
  }
  .omnia a:hover, .omnia a:focus-visible { border-color: var(--fg); }

  @media (max-width: 640px) {
    .hero { padding: 2.5vh 6vw 3vh; gap: 6vh; }
    .stack { gap: 14px; }
    .headline { font-size: clamp(30px, 9.5vw, 46px); line-height: 1; }
    .kicker { font-size: 11px; letter-spacing: 0.08em; }
    .cta { padding: 14px 30px; font-size: 12px; }
    .toprow { font-size: 10px; }
    .shot-card { width: 220px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee { animation-duration: 120s; }
  }
</style>
</head>
<body>

    <h1 class="headline">Inspired by the fear<br><em>of being average.</em></h1>

<main class="portfolio">

      <div class="shot-card"><img src="assets/results/1786235131664.png" width="884" height="126" alt="Resultado de tienda"></div>
      <div class="shot-card"><img src="assets/results/1786235145064.png" width="884" height="126" alt="Resultado de tienda"></div>
      <div class="shot-card"><img src="assets/results/1786235162804.png" width="884" height="126" alt="Resultado de tienda"></div>
      <div class="shot-card"><img src="assets/results/1786235179732.png" width="884" height="126" alt="Resultado de tienda"></div>

      <div class="shot-card"><img src="assets/results/1786235221151.png" width="820" height="126" alt="Resultado de tienda"></div>
      <div class="shot-card"><img src="assets/results/1786235235616.png" width="820" height="126" alt="Resultado de tienda"></div>

      <div class="shot-card" aria-hidden="true"><img src="assets/results/1786235131664.png" width="884" height="126" alt=""></div>

      <div class="shot-card" aria-hidden="true"><img src="assets/results/1786235162804.png" width="884" height="126" alt=""></div>

  </div>

  <div class="cta-wrap">

  <div class="omnia">

</main>

</body>
</html>
