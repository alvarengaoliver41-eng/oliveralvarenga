<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabajemos Juntos — Oliver Alvarenga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A1026;
      color: #F4F1EA;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #ambient-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.55;
    }
    .orb-1 {
      width: 65vw; height: 65vw; top: -20%; left: -15%;
      background: radial-gradient(circle, rgba(36,91,255,0.22) 0%, transparent 70%);
      animation: drift1 18s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 50vw; height: 50vw; bottom: -10%; right: -10%;
      background: radial-gradient(circle, rgba(127,231,255,0.12) 0%, transparent 70%);
      animation: drift2 24s ease-in-out infinite alternate;
    }
    @keyframes drift1 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5vw, 8vh) scale(1.1); }
    }
    @keyframes drift2 {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-6vw, -5vh) scale(0.9); }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0A1026; }
    ::-webkit-scrollbar-thumb { background: rgba(127,231,255,0.3); border-radius: 2px; }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; color: rgba(244,241,234,0.45); letter-spacing: 0.06em;
      text-decoration: none; font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover { color: #7FE7FF; }

    @media (max-width: 768px) {
      #ambient-bg { display: none; }
      .page-inner { padding: 20px 18px 60px !important; }
      .page-header h1 { font-size: clamp(40px, 11vw, 64px) !important; }
      .calendly-wrap { height: 750px !important; }
      .stats-row { gap: 28px !important; padding-top: 40px !important; margin-top: 40px !important; }
    }
    @media (max-width: 480px) {
      .calendly-wrap { height: 850px !important; }
    }
  </style>
</head>
<body>

  <div id="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div style="position: relative; z-index: 1; min-height: 100vh;">

    <!-- Nav -->
    <nav style="padding: 22px 36px; display: flex; justify-content: space-between; align-items: center;">
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7H2M6 3L2 7l4 4"/>
        </svg>
        Volver
      </a>
      <span style="font-size: 11px; color: rgba(127,231,255,0.35); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;">Oliver Alvarenga</span>
    </nav>

    <!-- Page content -->
    <div class="page-inner" style="max-width: 860px; margin: 0 auto; padding: 28px 32px 80px;">

      <!-- Header -->
      <div class="page-header" style="text-align: center; margin-bottom: 52px;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 22px;">
          <div style="width: 28px; height: 1px; background: rgba(127,231,255,0.4);"></div>
          <span style="font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(127,231,255,0.6); font-weight: 700;">Agendá tu llamada</span>
          <div style="width: 28px; height: 1px; background: rgba(127,231,255,0.4);"></div>
        </div>

        <h1 style="font-size: clamp(48px, 8vw, 96px); font-weight: 800; line-height: 0.93; letter-spacing: -0.04em; color: #F4F1EA; margin-bottom: 22px;">
          Trabajemos<br />
          <span style="color: #7FE7FF; font-weight: 300; font-style: italic; font-family: 'Times New Roman', Times, serif;">juntos.</span>
        </h1>

        <p style="font-size: 15px; color: rgba(244,241,234,0.5); font-weight: 300; line-height: 1.85; max-width: 400px; margin: 0 auto;">
          30 minutos. Sin compromiso. Te muestro exactamente qué sistema construiría para escalar tu negocio.
        </p>
      </div>

      <!-- Calendly widget -->
      <div style="
        background: rgba(36,91,255,0.06);
        border: 1px solid rgba(127,231,255,0.16);
        border-radius: 1.5rem;
        overflow: hidden;
        box-shadow: 0 40px 100px rgba(10,16,38,0.55), inset 0 1px 0 rgba(127,231,255,0.07);
        color-scheme: dark;
        margin-bottom: 0;
      ">
        <div id="calendly-inline-container" class="calendly-wrap" style="min-width: 320px; height: 700px; color-scheme: dark;"></div>
      </div>

      <!-- Stats -->
      <div class="stats-row" style="display: flex; gap: 48px; padding-top: 52px; margin-top: 52px; justify-content: center; flex-wrap: wrap; border-top: 1px solid rgba(127,231,255,0.1);">
        <div style="text-align: center;">
          <div style="font-size: 17px; font-weight: 800; color: #F4F1EA; letter-spacing: -0.02em;">End to end</div>
          <div style="font-size: 11px; color: rgba(127,231,255,0.4); font-weight: 300; margin-top: 5px; letter-spacing: 0.06em;">De la idea al deploy</div>
        </div>
        <div style="text-align: center;">
          <div style="font-size: 17px; font-weight: 800; color: #F4F1EA; letter-spacing: -0.02em;">Sin agencias</div>
          <div style="font-size: 11px; color: rgba(127,231,255,0.4); font-weight: 300; margin-top: 5px; letter-spacing: 0.06em;">Directo y sin rodeos</div>
        </div>
        <div style="text-align: center;">
          <div style="font-size: 17px; font-weight: 800; color: #F4F1EA; letter-spacing: -0.02em;">IA + código</div>
          <div style="font-size: 11px; color: rgba(127,231,255,0.4); font-weight: 300; margin-top: 5px; letter-spacing: 0.06em;">En cada decisión</div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <footer style="border-top: 1px solid rgba(127,231,255,0.1); padding: 32px 36px; display: flex; justify-content: space-between; align-items: center; max-width: 860px; margin: 0 auto;">
      <span style="font-size: 12px; color: rgba(244,241,234,0.4); font-weight: 300;">© 2026 Oliver Alvarenga.</span>
      <span style="font-size: 10px; color: rgba(127,231,255,0.35); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;">BUILT DIFFERENT</span>
    </footer>

  </div>

  <script>
    (function() {
      var url = 'https://calendly.com/oliveralvarengaxyz/30min?hide_gdpr_banner=1&background_color=0A1026&text_color=F4F1EA&primary_color=7FE7FF';
      var el = document.getElementById('calendly-inline-container');
      var init = function() {
        if (window.Calendly && el) {
          window.Calendly.initInlineWidget({ url: url, parentElement: el });
        }
      };
      var s = document.createElement('script');
      s.src = 'https://assets.calendly.com/assets/external/widget.js';
      s.async = true;
      s.onload = init;
      document.head.appendChild(s);
    })();
  </script>

</body>
</html>
